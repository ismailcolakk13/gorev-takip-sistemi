spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/taskdb}
    username: ${DB_USERNAME:ismail}
    password: ${DB_PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect