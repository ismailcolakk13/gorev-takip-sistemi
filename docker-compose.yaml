services:
  mysql:
    image: mysql:8.0
    container_name: gorev-takip-sistemi
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: taskdb
      MYSQL_USER: ${DB_USERNAME:ismail}
      MYSQL_PASSWORD: ${DB_PASSWORD:1234}
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
